[project]
name = "mcn-incubation-core"
version = "0.1.0"
description = "Host-independent incubation core for the fifth-generation MCN agent"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcn_incubation"]
